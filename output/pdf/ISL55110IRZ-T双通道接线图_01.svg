<text x="15" y="172" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.8" fill="#183146" text-anchor="start">R_PD_A/B：新增 10 kΩ 输入下拉（建议 0402）；现有源端串阻如有则保留，不重复叠加。</text>
<text x="15" y="178" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.8" fill="#183146" text-anchor="start">C30/C31 改接 VDD 去耦；C44/C45 改接 VH 去耦。两路输出分别保留 D6/D7，按原器件封装绑定。</text>
<text x="15" y="184" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.9" fill="#BA4148" text-anchor="start">+5V_DRV 需在芯片 10 脚满足 ≥5.0 V，且满足时序；不能直接等同于当前未经验证的主 +5 V。</text>
<text x="15" y="190" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.8" fill="#183146" text-anchor="start">D6/D7 方框是原有 TPD1E10B06DPYR 的功能表示；输出幅度取决于负载，见第 3 页。</text>
