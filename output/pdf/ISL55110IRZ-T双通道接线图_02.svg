<text x="19" y="165" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="3.5" fill="#236EA2" text-anchor="start">常开接法与替换关系</text>
<text x="19" y="172" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.9" fill="#183146" text-anchor="start">U4 与 U12 都移除，使用一颗 U13；旧 BUF602 的 VREF、-VCC 和原负电源去耦不再用于这一级。</text>
<text x="19" y="177" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.9" fill="#183146" text-anchor="start">ENABLE# 接地，PD 也接地。两路均为非反相：IN-A → OA，IN-B → OB；不要用 ISL55111 替代。</text>
<text x="19" y="182" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.9" fill="#183146" text-anchor="start">输入在复位/断电时不得悬空；下拉避免高阻态，但不能代替跨电源域的关断/防反灌设计。</text>
