<text x="134" y="106" font-size="2.7" font-family="SimHei,Microsoft YaHei,sans-serif" fill="#B34839" text-anchor="start">两条电源仅共地，不互连</text>
<text x="15" y="123" font-size="3.7" font-family="SimHei,Microsoft YaHei,sans-serif" fill="#1468A0" text-anchor="start">03 / 外围选型与布局</text>
<rect x="15" y="128" width="267" height="8" fill="#F2F6F8" stroke="#D3DDE4" stroke-width=".35"/>
<text x="18" y="133.5" font-size="2.6" font-family="SimHei,Microsoft YaHei,sans-serif" fill="#203448" text-anchor="start">L1</text>
<text x="66" y="133.5" font-size="2.65" font-family="SimHei,Microsoft YaHei,sans-serif" fill="#203448" text-anchor="start">1uH，屏蔽型；初选 Isat ≥ 5A、Irms ≥ 1.5A；按启动/故障电流复核</text>
<rect x="15" y="136" width="267" height="8" fill="white" stroke="#D3DDE4" stroke-width=".35"/>
<text x="18" y="141.5" font-size="2.6" font-family="SimHei,Microsoft YaHei,sans-serif" fill="#203448" text-anchor="start">C1 / C2</text>
<text x="66" y="141.5" font-size="2.65" font-family="SimHei,Microsoft YaHei,sans-serif" fill="#203448" text-anchor="start">10uF：0805 X5R/X7R，3.3V 下有效 ≥ 4.7uF；100nF：0402</text>
<rect x="15" y="144" width="267" height="8" fill="#F2F6F8" stroke="#D3DDE4" stroke-width=".35"/>
<text x="18" y="149.5" font-size="2.6" font-family="SimHei,Microsoft YaHei,sans-serif" fill="#203448" text-anchor="start">C3 / C4</text>
<text x="66" y="149.5" font-size="2.65" font-family="SimHei,Microsoft YaHei,sans-serif" fill="#203448" text-anchor="start">各 22uF：0805/1206 X5R/X7R；5.2V 下合计有效容量 ≥ 10uF</text>
<rect x="15" y="152" width="267" height="8" fill="white" stroke="#D3DDE4" stroke-width=".35"/>
<text x="18" y="157.5" font-size="2.6" font-family="SimHei,Microsoft YaHei,sans-serif" fill="#203448" text-anchor="start">R1 / R2 / R3 / R4</text>
<text x="66" y="157.5" font-size="2.65" font-family="SimHei,Microsoft YaHei,sans-serif" fill="#203448" text-anchor="start">0402；R3、R4 用 0.1%。反馈从输出电容正端安静取样</text>
<text x="15" y="169" font-size="3.7" font-family="SimHei,Microsoft YaHei,sans-serif" fill="#1468A0" text-anchor="start">04 / 控制与验证</text>
<text x="15" y="176" font-size="2.8" font-family="SimHei,Microsoft YaHei,sans-serif" fill="#203448" text-anchor="start">启动：GPIO 先置低 → 初始化 → 3.3V 稳定后延时（初选 20ms）→ EN 拉高 → 确认 VH 稳定。</text>
<text x="15" y="182" font-size="2.8" font-family="SimHei,Microsoft YaHei,sans-serif" fill="#203448" text-anchor="start">欠压/重启：启用合适 BOR；EN 关断不会主动放空输出电容，快速重启需检查 VH 残压与时序。</text>
<text x="15" y="188" font-size="2.8" font-family="SimHei,Microsoft YaHei,sans-serif" fill="#203448" text-anchor="start">布线：C3/C4 紧靠 VOUT/GND，缩小高频回路；电感和 SW 远离 TDC、GNSS 与调谐电压。</text>
<line x1="12" y1="197" x2="285" y2="197" stroke="#637487" stroke-width="0.25"/>
