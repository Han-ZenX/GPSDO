<text x="76" y="62" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.3" fill="#587084" text-anchor="middle">不割地</text>
<rect x="174" y="40" width="110" height="36" rx="1.5" fill="#F4F7F9" stroke="#CBD7DF" stroke-width=".25"/>
<text x="178" y="47" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="3.5" fill="#236EA2" text-anchor="start">布局取舍</text>
<text x="178" y="54" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.9" fill="#183146" text-anchor="start">GNSS 左上、OCXO 右上，避免热源紧贴。</text>
<text x="178" y="59" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.9" fill="#183146" text-anchor="start">模块边缘横向间隔约 14 mm：只是起点，</text>
<text x="178" y="64" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.9" fill="#183146" text-anchor="start">并非已验证的热隔离距离；需测冷启动。</text>
<text x="178" y="69" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.9" fill="#183146" text-anchor="start">时钟分配在 OCXO 输出脚旁，TDC 紧邻。</text>
<text x="178" y="74" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.9" fill="#183146" text-anchor="start">基准与调谐电路在 OCXO 下方，避开时钟。</text>
<rect x="174" y="87" width="110" height="31" rx="1.5" fill="#F4F7F9" stroke="#CBD7DF" stroke-width=".25"/>
<text x="178" y="94" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="3.5" fill="#236EA2" text-anchor="start">图中尺寸的含义</text>
<text x="178" y="101" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.9" fill="#183146" text-anchor="start">U7、U6 的外形按标称本体尺寸绘制。</text>
<text x="178" y="106" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.9" fill="#183146" text-anchor="start">其余方框是含周围 R/C 的预留区域，</text>
<text x="178" y="111" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.9" fill="#183146" text-anchor="start">不是封装边界、焊盘或确定安装坐标。</text>
<text x="178" y="116" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.9" fill="#183146" text-anchor="start">接口外伸和安装孔均需与机箱核对。</text>
<rect x="174" y="129" width="110" height="36" rx="1.5" fill="#F4F7F9" stroke="#CBD7DF" stroke-width=".25"/>
<text x="178" y="136" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="3.5" fill="#17846B" text-anchor="start">当前配置与空间预留</text>
<text x="178" y="143" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.9" fill="#183146" text-anchor="start">U7 为当前 OCXO；U5 是不装配备选。</text>
<text x="178" y="148" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.9" fill="#183146" text-anchor="start">如需兼容两种封装，另做焊盘叠放验证。</text>
<text x="178" y="153" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.9" fill="#183146" text-anchor="start">RF1 为 GNSS IPEX，RF2 为 OCXO 监测。</text>
<text x="178" y="158" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.9" fill="#183146" text-anchor="start">J1/J2 用板边 SMA，预留插拔空间。</text>
<text x="178" y="163" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.9" fill="#183146" text-anchor="start">70 mm 若拥挤，回退 75 mm，勿挤压 RF。</text>
<text x="175" y="184" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="2.8" fill="#587084" text-anchor="start">目标：比 75 × 75 mm 板框减少约 12.9% 面积。</text>
